<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>Rima FT</title>
    <meta name="description" content="Track your nutrition and get personalized AI diet plans with Rima FT" />
    <meta name="author" content="Rima FT" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#22c55e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rima FT" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <link rel="mask-icon" href="logo.png" color="#22c55e" />

    <!-- Open Graph -->
    <meta property="og:title" content="Rima FT" />
    <meta property="og:description" content="Track your nutrition and get personalized AI diet plans" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rima FT" />
    <meta name="twitter:description" content="Track your nutrition and get personalized AI diet plans" />
    <meta name="twitter:image" content="logo.png" />

    <!-- Keep the branded start screen visible before JavaScript and app CSS load. -->
    <link rel="preload" as="image" href="%BASE_URL%logo.png" />
    <style>
      .rima-start-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 24px;
        background: #071b15;
        color: #f5f7f2;
        font-family: "Outfit", system-ui, sans-serif;
        text-align: center;
      }
      .rima-start-brand { margin-top: -48px; }
      .rima-start-logo {
        display: block;
        width: 176px;
        height: 176px;
        margin: 0 auto 12px;
        border-radius: 32px;
      }
      .rima-start-title {
        margin: 0;
        color: #f5f7f2;
        font-size: 48px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -2px;
      }
      .rima-start-subtitle {
        display: block;
        margin-top: 10px;
        color: #b0c7bc;
        font-size: 16px;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: 3px;
      }
      .rima-start-status {
        position: absolute;
        right: 24px;
        bottom: calc(48px + env(safe-area-inset-bottom, 0px));
        left: 24px;
        color: #9eb8aa;
        font-size: 14px;
        line-height: 1.5;
      }
      .rima-start-dots { display: flex; justify-content: center; gap: 8px; }
      .rima-start-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #55ba80;
        animation: rima-start-pulse 1.4s ease-in-out infinite;
      }
      .rima-start-dots span:nth-child(2) { animation-delay: 0.16s; }
      .rima-start-dots span:nth-child(3) { animation-delay: 0.32s; }
      @keyframes rima-start-pulse {
        0%, 80%, 100% { opacity: 0.3; }
        40% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .rima-start-dots span { animation: none; opacity: 0.75; }
      }
      @media (max-height: 440px) {
        .rima-start-brand { margin-top: -24px; }
        .rima-start-logo { width: 96px; height: 96px; }
        .rima-start-title { font-size: 36px; }
        .rima-start-status { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <main class="rima-start-screen" aria-label="Rima FT is starting" aria-busy="true">
        <div class="rima-start-brand">
          <img class="rima-start-logo" src="%BASE_URL%logo.png" alt="" width="176" height="176" />
          <h1 class="rima-start-title">Rima FT<span class="rima-start-subtitle">Food Tracker</span></h1>
        </div>
        <div class="rima-start-status" role="status" aria-live="polite" aria-label="Loading Rima FT">
          <div class="rima-start-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
